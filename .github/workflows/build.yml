name: Build World Football Legends

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: pspdev/pspdev:latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Compile PSP program
        run: |
          cd "$GITHUB_WORKSPACE"
          psp-gcc -I"$PSPDEV/psp/sdk/include" \
            -c main.c -o main.o
