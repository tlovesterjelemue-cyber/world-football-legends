name: Build World Football Legends

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: pspdev/pspdev:latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          echo "Current directory:"
          pwd
          echo "Files in project:"
          ls -la
          echo "Checking Makefile:"
          test -f Makefile

      - name: Build PSP application
        run: make

      - name: Upload PSP application
        uses: actions/upload-artifact@v4
        with:
          name: World-Football-Legends-PSP
          path: EBOOT.PBP
