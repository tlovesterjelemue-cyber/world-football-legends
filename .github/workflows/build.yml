name: Build World Football Legends

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: pspdev/pspdev:latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build PSP application
        run: |
          cd "$GITHUB_WORKSPACE"
          make

      - name: Upload PSP application
        uses: actions/upload-artifact@v4
        with:
          name: World-Football-Legends-PSP
          path: EBOOT.PBP
